name: flightcheck

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    image: flightcheck-migrate:${FLIGHTCHECK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RUN_SEED: ${RUN_SEED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: Asia/Macau
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: 'no'

  web:
    image: flightcheck-web:${FLIGHTCHECK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TZ: Asia/Macau
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp

  worker:
    image: flightcheck-worker:${FLIGHTCHECK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TZ: Asia/Macau
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql "$$DATABASE_URL" -Atc "SELECT 1 FROM \"JobLock\" WHERE name = 'worker-heartbeat' AND \"expiresAt\" > NOW()" | grep -qx 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backup_data:/backups

volumes:
  postgres_data:
  backup_data:

networks:
  edge:
  backend:
    internal: true

name: flightcheck-worker

services:
  migrate:
    image: flightcheck-migrate:${FLIGHTCHECK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the external PostgreSQL URL in .env.worker}
      RUN_SEED: ${RUN_SEED:-true}
      TZ: Asia/Macau
    restart: 'no'

  worker:
    image: flightcheck-worker:${FLIGHTCHECK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the external PostgreSQL URL in .env.worker}
      TZ: Asia/Macau
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql "$$DATABASE_URL" -Atc "SELECT 1 FROM \"JobLock\" WHERE name = 'worker-heartbeat' AND \"expiresAt\" > NOW()" | grep -qx 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backup_data:/backups

volumes:
  backup_data:
